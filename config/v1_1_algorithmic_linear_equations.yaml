project:
  name: cftn_text_v1_1_algorithmic_linear_equations
  seed: 719
  artifact_root: G:/ctfn-text/artifacts/v1_1_algorithmic_linear_equations
  data_root: G:/ctfn-text/data/manifests/v1_1_algorithmic_linear_equations

data:
  format: cftn_text_linear_equations_v1_1
  calibration_examples: 5000
  train_examples: 100000
  validation_examples: 10000
  test_examples: 10000
  heldout_language_examples: 10000
  extrapolation_examples: 10000
  answer_extrapolation_examples: 10000
  compositional_examples: 10000
  max_math_length: 256
  max_gpt_length: 256
  maximum_abs_intermediate: 100000
  numeric_curriculum_bands:
    - name: foundations
      max_abs_a: 8
      max_abs_x: 20
      max_abs_b: 50
      weight: 0.20
      evaluation_weight: 0.20
    - name: two_digit
      max_abs_a: 16
      max_abs_x: 50
      max_abs_b: 125
      weight: 0.25
      evaluation_weight: 0.25
    - name: three_digit
      max_abs_a: 32
      max_abs_x: 100
      max_abs_b: 250
      weight: 0.25
      evaluation_weight: 0.25
    - name: full_support
      max_abs_a: 50
      max_abs_x: 200
      max_abs_b: 500
      weight: 0.30
      evaluation_weight: 0.30
  extrapolation_a_abs_min: 51
  extrapolation_a_abs_max: 80
  extrapolation_b_abs_min: 501
  extrapolation_b_abs_max: 800
  answer_extrapolation_x_abs_min: 201
  answer_extrapolation_x_abs_max: 400
  curriculum:
    enabled: true
    examples_per_epoch: 100000
    phases:
      - name: foundations
        through_epoch: 10
        max_difficulty: 1
      - name: two_digit
        through_epoch: 30
        max_difficulty: 2
      - name: three_digit
        through_epoch: 60
        max_difficulty: 3
      - name: full_support
        through_epoch: 100
        max_difficulty: 4

gpt:
  model_name: gpt2
  local_files_only: true
  receiver_layers: [7, 9, 11]

math_tower:
  layers: 8
  hidden_size: 384
  attention_heads: 6
  feed_forward_size: 1536
  dropout: 0.1
  max_sequence_length: 256
  receiver_layers: [2, 5]
  answer_min: -512
  answer_max: 512
  answer_head_mode: disabled

bridge:
  message_tokens: 8
  message_width: 256
  attention_heads: 8
  dropout: 0.1
  gate_hidden_size: 256
  gate_init: -2.0
  zero_init_output: true

math_training:
  batch_size: 128
  eval_batch_size: 256
  max_epochs: 100
  minimum_epochs: 70
  early_stop_patience: 15
  learning_rate: 0.0003
  minimum_learning_rate: 0.00001
  warmup_fraction: 0.03
  weight_decay: 0.01
  gradient_clip: 1.0
  answer_head_weight: 0.0
  precision: bf16
  num_workers: 2
  report_every_steps: 100

bridge_training:
  batch_size: 24
  eval_batch_size: 32
  max_epochs: 100
  minimum_epochs: 15
  early_stop_patience: 15
  learning_rate: 0.0002
  minimum_learning_rate: 0.00001
  warmup_fraction: 0.03
  weight_decay: 0.01
  gradient_clip: 1.0
  math_loss_weight: 1.0
  gpt_loss_weight: 1.0
  answer_head_weight: 0.0
  precision: bf16
  num_workers: 2
  report_every_steps: 100

evaluation:
  batch_size: 16
  maximum_generation_examples: 10000
  max_math_new_tokens: 128
  max_gpt_new_tokens: 32
  bootstrap_samples: 10000
  splits:
    - test
    - heldout_language
    - extrapolation
    - answer_extrapolation
    - compositional
  specialist_acceptance:
    test:
      exact_accuracy: 0.99
      valid_rate: 1.0
      trace_exact_rate: 0.95
    extrapolation:
      exact_accuracy: 0.95
      valid_rate: 1.0
    answer_extrapolation:
      exact_accuracy: 0.80
      valid_rate: 1.0
  collaboration_acceptance:
    test:
      exact_accuracy: 0.99
    heldout_language:
      exact_accuracy: 0.90
    extrapolation:
      exact_accuracy: 0.95
    answer_extrapolation:
      exact_accuracy: 0.80
    compositional:
      exact_accuracy: 0.90

monitoring:
  status_interval_minutes: 30
  detailed_report_every_epochs: 10
  keep_latest_checkpoints: 3

gpt_calibration:
  batch_size: 64
  candidate_batch_size: 64
  maximum_examples: 5000
  max_new_tokens: 16
  few_shot_examples: 3
  precision: bf16
  plausible_candidates: 8
  minimum_headroom_percentage_points: 20.0
  maximum_acceptable_gpt_accuracy: 0.80
