format: cftn_text_conditional_bridge_revision_v2

revision:
  name: cftn_text_v2_conditional_bridge
  seed: 719
  intent: scale_v1_2_non_destructive_message_utility_to_broad_math

source_bridge_stage: m2g
source_bridge_view_mode: shared
output_subdirectory: bridge_conditional_contextual
training_view_policy: mixed_necessity_v2

paths:
  base_config: config/v2_broad_math.yaml
  artifact_root: ${CFTN_ARTIFACT_ROOT:-artifacts/v2_broad_math_400k_r3}
  math_checkpoint: ${CFTN_ARTIFACT_ROOT:-artifacts/v2_broad_math_400k_r3}/math_selected/math.selected.pth
  source_bridge_checkpoint: ${CFTN_ARTIFACT_ROOT:-artifacts/v2_broad_math_400k_r3}/bridge_m2g_contextual/bridge_m2g.best.pth
  mechanism_prerequisite_report: ${CFTN_ARTIFACT_ROOT:-artifacts/v2_broad_math_400k_r3}/mechanism_prerequisites.json
  specialist_report: ${CFTN_ARTIFACT_ROOT:-artifacts/v2_broad_math_400k_r3}/evaluation_math_v2/report.json

training:
  base_train_examples: 50000
  base_validation_examples: 5000
  batch_size: 24
  eval_batch_size: 32
  max_epochs: 30
  minimum_epochs: 8
  early_stop_patience: 6
  learning_rate: 0.00002
  minimum_learning_rate: 0.000002
  gate_learning_rate_multiplier: 0.25
  warmup_fraction: 0.05
  weight_decay: 0.01
  gradient_clip: 1.0
  precision: bf16
  num_workers: 4
  report_every_steps: 200
  math_loss_weight: 1.0
  gpt_loss_weight: 1.0
  answer_head_weight: 0.0
  preservation_weight: 2.0
  contrastive_weight: 0.5
  contrastive_margin: 0.25
  redundant_gate_weight: 0.05

validation:
  generation_examples_per_view: 256
  generation_batch_size: 16
  max_math_new_tokens: 1152
  max_gpt_new_tokens: 64

acceptance:
  minimum_required_synergy_gain: 0.10
  minimum_required_gpt_to_math_gain: 0.10
  minimum_required_correct_vs_shuffled_gap: 0.05
  minimum_required_math_to_gpt_gain: 0.10
  maximum_redundant_math_regression: 0.02
  minimum_gate_separation: 0.05

monitoring:
  status_interval_minutes: 30
  detailed_report_every_epochs: 1
  keep_latest_checkpoints: 3

wandb:
  project: ${WANDB_PROJECT:-cftn-text-v2}
  group: ${WANDB_GROUP:-scaled-multi-specialist-r3}
  entity: ${WANDB_ENTITY:-}
  mode: online
  require_api_key_environment: true
