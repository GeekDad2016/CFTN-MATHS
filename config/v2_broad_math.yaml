    - heldout_language
    - extrapolation
    - compositional
    - gsm8k_test
    - mathqa_validation
    - mathqa_test
    - gsm_symbolic
    - gsm_symbolic_p1
    - gsm_symbolic_p2
  collaboration_splits:
    - test
    - heldout_language
    - extrapolation
    - compositional
  shared_no_harm_splits:
    - test
    - heldout_language
    - extrapolation
    - compositional
  maximum_shared_math_regression: 0.02
  specialist_gates:
    test: 0.70
    heldout_language: 0.60
    extrapolation: 0.40
    compositional: 0.50
    gsm8k_test: 0.15
    mathqa_validation: 0.15
    mathqa_test: 0.15
    gsm_symbolic: 0.10
    gsm_symbolic_p1: 0.10
    gsm_symbolic_p2: 0.10

monitoring:
  status_interval_minutes: 30
  detailed_report_every_epochs: 1
  keep_latest_checkpoints: 3

gpt_calibration:
  batch_size: 32
  candidate_batch_size: 32
