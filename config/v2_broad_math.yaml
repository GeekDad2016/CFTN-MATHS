gpt:
  model_name: Qwen/Qwen3-4B-Instruct-2507
  # Immutable verified Hugging Face revision (the repository's tokenizer update).
  revision: cdbee75f17c01a7cc42f958dc650907174af0554
  architecture: dense
  require_dense: true
  expected_model_type: qwen3
  expected_hidden_size: 2560
  expected_layers: 36
  dtype: bfloat16
  attn_implementation: sdpa
  trust_remote_code: false
  use_chat_template: true
  local_files_only: false
  receiver_layers: [11, 23, 35]

math_tower:
  # Proof-scale tower. Its external CFTN contract is tokenizer-independent:
  # raw UTF-8 enters and a typed answer payload leaves. The byte tokenizer is
  # this run's internal implementation and can later be replaced by a
  # pretrained/distilled student's native tokenizer without changing routing.
  tokenizer_kind: lossless_utf8_bytes_v1
  request_contract: raw_utf8_problem_v1
  result_contract: typed_answer_payload_v1
  layers: 8
  hidden_size: 384
  attention_heads: 6
  feed_forward_size: 1536
  dropout: 0.1
  max_sequence_length: 4096
  receiver_layers: [2, 5]
  answer_head_mode: disabled
  answer_min: -4096
  answer_max: 4096

bridge:
  message_tokens: 8
  message_width: 256
  attention_heads: 8
  dropout: 0.1
  gate_hidden_size: 256
  gate_init: -2.0
  zero_init_output: true

math_training:
  batch_size: 32
  eval_batch_size: 64
  max_epochs: 100
  minimum_epochs: 60
  early_stop_patience: 10
  early_stopping_enabled: true
  learning_rate: 0.0003
  minimum_learning_rate: 0.000015
  warmup_fraction: 0.03
  weight_decay: 0.01
  gradient_clip: 1.0
  answer_head_weight: 0.0
  precision: bf16
  num_workers: 4
  report_every_steps: 250
  keep_latest_checkpoints: 12

bridge_training:
  batch_size: 12
  eval_batch_size: 24
  max_epochs: 12
  minimum_epochs: 6
  early_stop_patience: 4
  learning_rate: 0.0002
  minimum_learning_rate: 0.00001
  warmup_fraction: 0.03
  weight_decay: 0.01
  gradient_clip: 1.0
  math_loss_weight: 1.0
  gpt_loss_weight: 1.0
  answer_head_weight: 0.0
  precision: bf16
  num_workers: 4
  report_every_steps: 250
  keep_latest_checkpoints: 3

checkpoint_selection:
  split: validation
  generation_examples: 512

evaluation:
  batch_size: 16
  maximum_generation_examples: 5000
  collaboration_maximum_examples: 2000
  generation_policy: full_context_v1
  max_math_new_tokens: 2048
  max_gpt_new_tokens: 64
  bootstrap_samples: 10000
  specialist_splits:
