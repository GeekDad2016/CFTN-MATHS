format: cftn_text_multi_specialist_revision_v2

revision:
  name: cftn_text_v2_scaled_conditional_multi_specialist
  seed: 719
  intent: scale_v1_3_capabilities_with_fresh_bridges_and_safe_conditional_execution

prerequisite:
  mode: fresh_multi_specialist
  prior_reports_are_provenance_only: true

paths:
  base_config: config/v2_broad_math.yaml
  prior_v1_2_report: evidence/v1_2_final_report.json
  prior_v1_3_report: evidence/v1_3_final_report.json
  math_checkpoint: ${CFTN_ARTIFACT_ROOT:-artifacts/v2_broad_math_400k_r3}/math_selected/math.selected.pth
  math_evaluation_report: ${CFTN_ARTIFACT_ROOT:-artifacts/v2_broad_math_400k_r3}/evaluation_math_v2/report.json
  data_root: ${CFTN_V2_MULTI_DATA_ROOT:-data/manifests/v2_multi_specialist_r2}
  artifact_root: ${CFTN_ARTIFACT_ROOT:-artifacts/v2_broad_math_400k_r3}

specialist_registry:
  maximum_slots: 12
  active:
    - name: math
      capability: broad_symbolic_and_word_problem_math
      source: v2_selected_math_checkpoint
      datasets:
        training: [openai/gsm8k]
        note: the sealed V2 math mix also includes project generators, DeepMind Mathematics, and MathQA
    - name: string
      capability: exact_byte_level_string_operations
      source: train_from_scratch
      datasets:
        training: [project_deterministic_generator]
        note: synthetic generation is preferable because every byte-level target is exactly verifiable
  reserved:
    - name: code
      state: reserved_inactive
      train: false
      capability: code_generation_debugging_and_execution
      datasets:
        training:
          - {id: google-research-datasets/mbpp, split: train, access: open, license: cc-by-4.0}
        evaluation:
          - {id: openai/openai_humaneval, split: test, access: open, license: mit}
      note: excluded_from_wake_targets_optimizers_checkpoints_and_compute
    - name: formal_logic
      state: reserved_inactive
      train: false
      capability: deductive_logic_constraint_solving_and_planning
      datasets:
        training:
          - {id: tasksource/ruletaker, split: train, access: open, license: apache-2.0}
        evaluation:
          - {id: tasksource/folio, split: validation, access: open, license: license-review-required}
      note: excluded_from_wake_targets_optimizers_checkpoints_and_compute
    - name: science
      state: reserved_inactive
      train: false
      capability: grounded_science_question_answering
      datasets:
        training:
          - {id: allenai/ai2_arc, subset: ARC-Challenge, split: train, access: open, license: cc-by-sa-4.0}
        evaluation:
          - {id: allenai/ai2_arc, subset: ARC-Challenge, split: validation, access: open, license: cc-by-sa-4.0}
      note: excluded_from_wake_targets_optimizers_checkpoints_and_compute
    - name: retrieval
      state: reserved_inactive
      train: false
      capability: evidence_retrieval_and_multihop_question_answering
      datasets:
        training:
          - {id: rajpurkar/squad, split: train, access: open, license: cc-by-sa-4.0}
          - {id: hotpotqa/hotpot_qa, subset: distractor, split: train, access: open, license: cc-by-sa-4.0}
        evaluation:
          - {id: hotpotqa/hotpot_qa, subset: distractor, split: validation, access: open, license: cc-by-sa-4.0}
      note: excluded_from_wake_targets_optimizers_checkpoints_and_compute
    - name: long_context
      state: reserved_inactive
      train: false
      capability: long_document_reading_and_evidence_synthesis
      datasets:
        training:
          - {id: allenai/qasper, split: train, access: open, license: cc-by-4.0}
        evaluation:
          - {id: zai-org/LongBench, access: open, license: dataset-card-review-required}
      note: excluded_from_wake_targets_optimizers_checkpoints_and_compute
    - name: multilingual
      state: reserved_inactive
      train: false
      capability: multilingual_understanding_and_translation
      datasets:
        training:
          - {id: google/wmt24pp, split: train, access: open, license: apache-2.0}
        evaluation:
          - {id: openlanguagedata/flores_plus, access: gated, license: cc-by-sa-4.0, use: evaluation-only}
      note: excluded_from_wake_targets_optimizers_checkpoints_and_compute
    - name: tool_use
      state: reserved_inactive
      train: false
      capability: typed_function_selection_and_argument_generation
      datasets:
        training:
          - {id: glaiveai/glaive-function-calling-v2, split: train, access: open, license: apache-2.0}
        optional_training:
          - {id: Salesforce/xlam-function-calling-60k, split: train, access: gated, license: cc-by-4.0}
      note: optional_xlam_source_requires_huggingface_terms_acceptance
    - name: structured_data
      state: reserved_inactive
      train: false
      capability: text_to_sql_and_table_reasoning
      datasets:
        training:
          - {id: b-mc2/sql-create-context, split: train, access: open, license: cc-by-4.0}
        evaluation:
          - {id: xlangai/spider, split: validation, access: open, license: dataset-card-review-required}
      note: excluded_from_wake_targets_optimizers_checkpoints_and_compute
    - name: information_extraction
      state: reserved_inactive
      train: false
      capability: named_entity_relation_and_schema_extraction
      datasets:
        training:
          - {id: DFKI-SLT/few-nerd, subset: supervised, split: train, access: open, license: cc-by-sa-4.0}
        evaluation:
          - {id: DFKI-SLT/few-nerd, subset: supervised, split: test, access: open, license: cc-by-sa-4.0}
      note: excluded_from_wake_targets_optimizers_checkpoints_and_compute
    - name: commonsense
      state: reserved_inactive
      train: false
      capability: commonsense_and_social_reasoning
      datasets:
        training:
          - {id: tau/commonsense_qa, split: train, access: open, license: mit}
        evaluation:
          - {id: tau/commonsense_qa, split: validation, access: open, license: mit}
      note: excluded_from_wake_targets_optimizers_checkpoints_and_compute

data:
  ascii_only: true
  string_train_examples: 200000
  string_validation_examples: 15000
  string_test_examples: 15000
  string_heldout_paraphrase_examples: 15000
  string_extrapolation_examples: 15000
  string_compositional_examples: 15000
  joint_train_examples: 160000
  joint_validation_examples: 10000
  joint_test_examples: 15000
  joint_heldout_paraphrase_examples: 10000
  joint_extrapolation_examples: 10000
  joint_counterfactual_examples: 10000
  joint_unseen_composition_examples: 10000
  maximum_string_length_train: 48
  maximum_string_length_extrapolation: 96
  maximum_gpt_length: 384
  maximum_specialist_length: 512
  task_shares:
    pure_language: 0.15
    explicit_math: 0.15
    exact_string: 0.15
    language_dependent_math: 0.20
    multi_specialist: 0.35

gpt_interface:
  answer_protocol: first_nonempty_completion_line_v1
  generic_answer_cue: "Exact result:"
  pure_language_prompt_style: archival_key_value_v1
  completion_terminator: "\n"
  prompt_transport: tokenizer_chat_template_v1
  calibration_max_new_tokens: 16

string_tower:
  layers: 8
  hidden_size: 384
  attention_heads: 6
  feed_forward_size: 1536
  dropout: 0.1
  max_sequence_length: 512
  receiver_layers: [2, 5, 7]
  answer_min: -2048
  answer_max: 2048
  answer_head_mode: disabled

bridge:
  message_tokens: 12
  message_width: 384
  attention_heads: 8
  dropout: 0.1
  gate_hidden_size: 384
  gate_init: -2.0
  zero_init_output: true

runtime:
  specialist_names: [math, string]
  maximum_callosal_rounds: 3
  wake_threshold: 0.50
  hard_wake_straight_through: true
  conditional_execution_in_hard_mode: true
  hard_halt_enabled: false
  neutral_workspaces:
    math: "<workspace:math><latent-request>"
    string: "<workspace:string><latent-request>"

# Qwen provides frozen semantic features; a compact CNN validates source shape
# and spans; hierarchical heads select delegation, towers, dependency rounds,
# and the registered graph. The model never predicts operand values: the typed
# compiler copies them from immutable prompt spans. Unknown/low-confidence
# prompts fail closed and inactive tower slots cannot be selected.
dispatcher:
  format: cftn_text_v2_hierarchical_dispatcher_v2
  artifact_directory: learned_dispatcher_v2
  maximum_length: 2048
  confidence_threshold: 0.90
  epochs: 15
  patience: 4
  batch_size: 256
  learning_rate: 0.0003
  weight_decay: 0.0001
  semantic_encoder:
    source: frozen_coordinator_prepass
    pooling: attention_mask_mean_final_hidden_v1
    maximum_length: 768
    batch_size: 16
    use_chat_template: true
    cache_dtype: float16
  model:
    semantic_width: 2560
    semantic_projection_size: 1536
    structure_projection_size: 384
    fusion_size: 384
    embedding_size: 64
    channels: 96
    kernels: [3, 5, 7]
    dropout: 0.10
    hierarchy_weight: 0.25
    parameter_target: 5000000
    parameter_tolerance: 500000
    tower_names: [math, string, code, formal_logic, science, retrieval, long_context, multilingual, tool_use, structured_data, information_extraction, commonsense]
    active_tower_names: [math, string]
  losses:
    intent: 1.0
    delegation: 0.25
    towers: 0.25
    rounds: 0.20
  broad_train_examples: 100000
  joint_train_examples: 100000
  semantic_train_examples: 45000
  registered_validation_examples: 5000
  registered_heldout_examples: 5000
  broad_validation_examples: 5000
  broad_heldout_examples: 5000
  semantic_holdout_examples: 5000
  acceptance:
    minimum_registered_accuracy: 1.0
    minimum_registered_coverage: 1.0
    minimum_broad_accuracy: 0.995
    minimum_broad_coverage: 0.995
    minimum_semantic_accuracy: 0.995
    minimum_semantic_coverage: 0.995

# Retained for checkpoint shape compatibility and optional learned-composer
# diagnostics. The accepted production path composes typed result references
# deterministically, so answer text cannot be corrupted by a second decoder.
answer_composer:
  hidden_size: 256
  attention_heads: 8
  decoder_layers: 2
  dropout: 0.10
  maximum_source_positions: 64
  maximum_target_positions: 48

native_dispatch_evaluation:
  artifact_directory: native_dispatch_evaluation
  specialist_generation_policy: full_context_v1
  examples_by_class:
    explicit_math: 64
    exact_string: 300
    language_dependent_math: 64
    multi_parallel: 192
    multi_sequential: 128
  task_acceptance:
    minimum_answer_bus_valid_rate: 0.95
    minimum_explicit_math_accuracy: 0.95
    minimum_language_dependent_math_accuracy: 0.95
    minimum_exact_string_reverse_accuracy: 0.85
    minimum_multi_parallel_accuracy: 0.85
    minimum_multi_sequential_accuracy: 0.90
  dispatch_acceptance:
    minimum_plan_valid_rate: 0.99
    minimum_completion_rate: 0.95

string_training:
  batch_size: 256
  eval_batch_size: 256
  max_epochs: 30
  minimum_epochs: 15
  early_stop_patience: 6
  learning_rate: 0.0003
  minimum_learning_rate: 0.00001
  warmup_fraction: 0.03
  weight_decay: 0.01
  gradient_clip: 1.0
  precision: bf16
  num_workers: 4
  report_every_steps: 100

integration_training:
  phases:
    - name: single_specialist_capacity
      max_epochs: 8
      wake_mode: oracle_dense
      maximum_rounds: 1
      include_task_classes: [explicit_math, exact_string]
    - name: dense_mixed_messages
      max_epochs: 12
      wake_mode: dense
      maximum_rounds: 1
      include_task_classes: [pure_language, explicit_math, exact_string, language_dependent_math, multi_parallel]
    - name: dense_recurrent
      max_epochs: 12
      wake_mode: dense
      maximum_rounds: 3
      include_task_classes: [pure_language, explicit_math, exact_string, language_dependent_math, multi_parallel, multi_sequential]
    - name: supervised_soft_wake
      max_epochs: 10
      wake_mode: soft
      maximum_rounds: 3
      include_task_classes: [pure_language, explicit_math, exact_string, language_dependent_math, multi_parallel, multi_sequential]
    - name: hardened_wake
      max_epochs: 10
      wake_mode: hard_straight_through
      maximum_rounds: 3
      include_task_classes: [pure_language, explicit_math, exact_string, language_dependent_math, multi_parallel, multi_sequential]
      trainable_components: [wake_gates]
      learning_rate: 0.0000005
      minimum_learning_rate: 0.00000025
      warmup_fraction: 0.0
      weight_decay: 0.0
  batch_size: 48
  eval_batch_size: 64
  learning_rate: 0.00002
  gate_learning_rate_multiplier: 0.25
  minimum_learning_rate: 0.000002
  warmup_fraction: 0.05
  weight_decay: 0.01
  gradient_clip: 1.0
  precision: bf16
  num_workers: 4
  report_every_steps: 100
  keep_latest_checkpoints: 3
  auxiliary_every_steps: 4
  validation_causal_examples: 1024
  hard_transition_baseline:
    required: true
    source_phase: supervised_soft_wake
    wake_mode: hard_straight_through
    optimizer_updates: 0
  hardening_guard:
    maximum_pure_language_false_wake_rate: 0.05
    minimum_exact_required_set_accuracy: 0.90
    minimum_wake_precision: 0.90
    minimum_wake_recall: 0.95
    maximum_sequence_accuracy_drop_from_zero_update_baseline: 0.02
    maximum_exact_set_drop_from_zero_update_baseline: 0.02
    maximum_all_open_rate: 0.95
    maximum_all_closed_rate: 0.95
  losses:
    task: 1.0
    specialist: 1.0
    causal_message: 0.5
    causal_message_margin: 0.25
    no_harm: 2.0
    wake_required_set: 1.0
    causal_wake_utility: 0.5
    causal_wake_margin: 0.25
    halt: 0.25
    active_compute_initial: 0.0
    active_compute_hardening: 0.0

evaluation:
  primary_split: joint_test
  diagnostic_splits:
    - joint_heldout_paraphrase
    - joint_extrapolation
    - joint_counterfactual
    - joint_unseen_composition
  competence_conditioning:
    enabled: true
    oracle_native_inputs: true
    diagnostics_are_non_gating: true
  generation_batch_size: 32
  maximum_examples_per_split: 15000
  max_specialist_new_tokens: 384
  max_gpt_new_tokens: 64
  bootstrap_samples: 10000
  arms:
    - gpt_alone
    - math_alone
    - string_alone
    - dense_cftn
    - learned_wake_cftn
    - oracle_wake_cftn
    - all_closed
    - each_specialist_disabled
    - each_direction_disabled
    - messages_shuffled
    - fixed_open
    - one_round
    - serial_pipeline

acceptance:
  minimum_gpt_language_calibration_accuracy: 0.90
  minimum_native_familiar_exact_accuracy: 0.95
  minimum_math_familiar_exact_accuracy: 0.70
  minimum_string_familiar_exact_accuracy: 0.95
  minimum_task_matched_oracle_exact_accuracy: 0.95
  minimum_primary_competence_coverage: 0.95
  maximum_pure_language_regression: 0.02
  maximum_pure_language_false_wake_rate: 0.05
  minimum_wake_recall: 0.95
  minimum_wake_precision: 0.90
  minimum_exact_required_set_accuracy: 0.90
  minimum_joint_synergy_gain: 0.10
  minimum_required_bridge_ablation_loss: 0.10
  maximum_irrelevant_bridge_effect: 0.02
  maximum_hard_vs_dense_regression: 0.02
  minimum_compute_reduction: 0.30
  minimum_sequential_accuracy: 0.80
  minimum_multiround_gain: 0.10

monitoring:
  poll_seconds: 1800
  detailed_report_every_epochs: 1

wandb:
  project: ${WANDB_PROJECT:-cftn-text-v2}
  group: ${WANDB_GROUP:-scaled-multi-specialist-r3}
  mode: online
  require_api_key_environment: true
